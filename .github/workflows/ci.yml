name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named `ci` because that is the context main's branch protection requires.
  # Renaming it would leave every pull request waiting for a check nobody runs.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed from the tip is still a leaked secret.
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source=/repo --redact --verbose --exit-code=1

      - name: Verify the Company Brain has not drifted from the delivered bundle
        run: diff assets/company_brain/screening_policy.md company_brain/versions/v1/screening_policy.md

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      # Excluded explicitly rather than by the key being absent, because the eval
      # job needs that key in this same workflow. Nothing is lost: the eval job
      # makes 36 real calls through the same orchestrator.
      - name: Unit tests
        run: uv run pytest -q -m "not live"

  # The gate runs the configuration production runs — the adjudication loop on,
  # the same model, the same code path. What protects the budget is when it
  # fires, not what it does: draft pull requests skip it. (D-016)
  evals:
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      # Exit 1 is a gate failing, which is a fact about the change. Exit 2 is the
      # suite being unable to measure — an overloaded model is not a regression,
      # and there is no retry, because a gate that retries until it passes is a
      # gate that passes.
      - name: Eval gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python evals/run_evals.py --runs 3 --concurrency 4 --max-cost-usd 2.50

      - name: Publish the results summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.md
