name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed from the tip is still a leaked secret.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the Company Brain has not drifted from the delivered bundle
        run: diff assets/company_brain/screening_policy.md company_brain/versions/v1/screening_policy.md

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Unit tests
        run: uv run pytest -q

      # The eval gate (false-clear rate, determinism check) is added here by
      # spec 005. This workflow is shaped so that is an addition, not a rewrite.
